<!doctype html>

<html lang="pt-BR">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hoje tem bb?</title>
  <script src="/_sdk/element_sdk.js"></script>
  <style>

    body {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Comic Sans MS', 'Chalkboard SE', 'Arial Rounded MT Bold', cursive, sans-serif;
      overflow: hidden;
      width: 100%;
      height: 100%;
    }

    html, body {
      height: 100%;
    }

    .page {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    #initial-page {
      background-color: #1a1a1a;
    }

    #celebration-page {
      background-color: #ffffff;
      display: none;
    }

    .question {
      font-size: 4rem;
      font-weight: bold;
      margin-bottom: 3rem;
      text-align: center;
      padding: 0 2rem;
    }

    .buttons-container {
      display: flex;
      gap: 2rem;
      flex-wrap: wrap;
      justify-content: center;
      padding: 0 2rem;
    }

    .btn {
      padding: 1.5rem 3rem;
      font-size: 1.5rem;
      font-weight: bold;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      transition: all 0.3s ease;
      font-family: inherit;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
    }

    .btn-yes {
      background-color: #ff69b4;
      color: white;
    }

    .btn-yes:hover {
      background-color: #ff1493;
      transform: scale(1.1);
    }

    .btn-no {
      background-color: #6c757d;
      color: white;
      position: absolute;
    }

    .celebration-text {
      font-size: 5rem;
      font-weight: bold;
      text-align: center;
      animation: bounce 0.6s infinite alternate;
      padding: 0 2rem;
    }

    .hearts-container {
      position: absolute;
      width: 100%;
      height: 100%;
      pointer-events: none;
      overflow: hidden;
    }

    .heart {
      position: absolute;
      font-size: 2rem;
      animation: float 3s ease-in-out infinite;
      opacity: 0.3;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-20px) rotate(10deg); }
    }

    @keyframes bounce {
      from { transform: scale(1); }
      to { transform: scale(1.1); }
    }

    @keyframes celebration-hearts {
      0% {
        transform: translateY(100%) scale(0) rotate(0deg);
        opacity: 0;
      }
      50% {
        opacity: 1;
      }
      100% {
        transform: translateY(-100%) scale(1) rotate(360deg);
        opacity: 0;
      }
    }

    .celebration-heart {
      position: absolute;
      font-size: 3rem;
      animation: celebration-hearts 2s ease-out forwards;
    }

    @media (max-width: 768px) {
      .question {
        font-size: 2.5rem;
      }
      
      .btn {
        padding: 1rem 2rem;
        font-size: 1.2rem;
      }
      
      .celebration-text {
        font-size: 3rem;
      }
    }
  </style>
  <style>@view-transition { navigation: auto; }</style>
  <script src="/_sdk/data_sdk.js" type="text/javascript"></script>
  <script src="https://cdn.tailwindcss.com" type="text/javascript"></script>
 </head>
 <body>
  <div id="initial-page" class="page">
   <div class="hearts-container"><span class="heart" style="left: 10%; top: 20%;">💕</span> <span class="heart" style="left: 80%; top: 30%; animation-delay: 1s;">❤️</span> <span class="heart" style="left: 20%; top: 70%; animation-delay: 2s;">💖</span> <span class="heart" style="left: 70%; top: 60%; animation-delay: 1.5s;">💗</span> <span class="heart" style="left: 50%; top: 15%; animation-delay: 0.5s;">💝</span>
   </div>
   <h1 class="question" id="question">Hoje tem?</h1>
   <div class="buttons-container"><button class="btn btn-yes" id="btn-yes">SIM</button> <button class="btn btn-no" id="btn-no">NÃO</button>
   </div>
  </div>
  <div id="celebration-page" class="page">
   <h1 class="celebration-text" id="celebration-text">AAAEEEEEEE</h1>
  </div>
  <script>
    const defaultConfig = {
      question_text: "Hoje tem?",
      yes_button_text: "SIM",
      no_button_text: "NÃO",
      celebration_text: "AAAEEEEEEE",
      primary_color: "#ff69b4",
      secondary_color: "#1a1a1a",
      text_color: "#ff69b4",
      button_color: "#6c757d",
      celebration_bg: "#ffffff",
      font_family: "Comic Sans MS",
      font_size: 16
    };

    let config = { ...defaultConfig };

    const btnNo = document.getElementById('btn-no');
    const btnYes = document.getElementById('btn-yes');
    const initialPage = document.getElementById('initial-page');
    const celebrationPage = document.getElementById('celebration-page');

    function moveButtonRandomly() {
      const container = initialPage;
      const containerRect = container.getBoundingClientRect();
      const btnRect = btnNo.getBoundingClientRect();
      
      const maxX = containerRect.width - btnRect.width - 40;
      const maxY = containerRect.height - btnRect.height - 40;
      
      const randomX = Math.random() * maxX + 20;
      const randomY = Math.random() * maxY + 20;
      
      btnNo.style.left = randomX + 'px';
      btnNo.style.top = randomY + 'px';
    }

    btnNo.addEventListener('mouseenter', moveButtonRandomly);
    btnNo.addEventListener('touchstart', (e) => {
      e.preventDefault();
      moveButtonRandomly();
    });

    btnYes.addEventListener('click', () => {
      initialPage.style.display = 'none';
      celebrationPage.style.display = 'flex';
      
      for (let i = 0; i < 20; i++) {
        setTimeout(() => {
          createCelebrationHeart();
        }, i * 100);
      }
    });

    function createCelebrationHeart() {
      const heart = document.createElement('span');
      heart.className = 'celebration-heart';
      heart.textContent = ['💕', '❤️', '💖', '💗', '💝'][Math.floor(Math.random() * 5)];
      heart.style.left = Math.random() * 100 + '%';
      celebrationPage.appendChild(heart);
      
      setTimeout(() => {
        heart.remove();
      }, 2000);
    }

    moveButtonRandomly();

    async function onConfigChange(newConfig) {
      const questionEl = document.getElementById('question');
      const btnYesEl = document.getElementById('btn-yes');
      const btnNoEl = document.getElementById('btn-no');
      const celebrationTextEl = document.getElementById('celebration-text');
      const initialPageEl = document.getElementById('initial-page');
      const celebrationPageEl = document.getElementById('celebration-page');

      const customFont = newConfig.font_family || defaultConfig.font_family;
      const baseFont = 'Arial Rounded MT Bold, cursive, sans-serif';
      const fontFamily = `${customFont}, ${baseFont}`;
      const fontSize = newConfig.font_size || defaultConfig.font_size;

      document.body.style.fontFamily = fontFamily;

      questionEl.textContent = newConfig.question_text || defaultConfig.question_text;
      questionEl.style.color = newConfig.text_color || defaultConfig.text_color;
      questionEl.style.fontSize = `${fontSize * 4}px`;

      btnYesEl.textContent = newConfig.yes_button_text || defaultConfig.yes_button_text;
      btnYesEl.style.backgroundColor = newConfig.primary_color || defaultConfig.primary_color;
      btnYesEl.style.fontSize = `${fontSize * 1.5}px`;

      btnNoEl.textContent = newConfig.no_button_text || defaultConfig.no_button_text;
      btnNoEl.style.backgroundColor = newConfig.button_color || defaultConfig.button_color;
      btnNoEl.style.fontSize = `${fontSize * 1.5}px`;

      celebrationTextEl.textContent = newConfig.celebration_text || defaultConfig.celebration_text;
      celebrationTextEl.style.color = newConfig.primary_color || defaultConfig.primary_color;
      celebrationTextEl.style.fontSize = `${fontSize * 5}px`;

      initialPageEl.style.backgroundColor = newConfig.secondary_color || defaultConfig.secondary_color;
      celebrationPageEl.style.backgroundColor = newConfig.celebration_bg || defaultConfig.celebration_bg;
    }

    if (window.elementSdk) {
      window.elementSdk.init({
        defaultConfig,
        onConfigChange,
        mapToCapabilities: (config) => ({
          recolorables: [
            {
              get: () => config.primary_color || defaultConfig.primary_color,
              set: (value) => {
                config.primary_color = value;
                window.elementSdk.setConfig({ primary_color: value });
              }
            },
            {
              get: () => config.secondary_color || defaultConfig.secondary_color,
              set: (value) => {
                config.secondary_color = value;
                window.elementSdk.setConfig({ secondary_color: value });
              }
            },
            {
              get: () => config.text_color || defaultConfig.text_color,
              set: (value) => {
                config.text_color = value;
                window.elementSdk.setConfig({ text_color: value });
              }
            },
            {
              get: () => config.button_color || defaultConfig.button_color,
              set: (value) => {
                config.button_color = value;
                window.elementSdk.setConfig({ button_color: value });
              }
            },
            {
              get: () => config.celebration_bg || defaultConfig.celebration_bg,
              set: (value) => {
                config.celebration_bg = value;
                window.elementSdk.setConfig({ celebration_bg: value });
              }
            }
          ],
          borderables: [],
          fontEditable: {
            get: () => config.font_family || defaultConfig.font_family,
            set: (value) => {
              config.font_family = value;
              window.elementSdk.setConfig({ font_family: value });
            }
          },
          fontSizeable: {
            get: () => config.font_size || defaultConfig.font_size,
            set: (value) => {
              config.font_size = value;
              window.elementSdk.setConfig({ font_size: value });
            }
          }
        }),
        mapToEditPanelValues: (config) => new Map([
          ["question_text", config.question_text || defaultConfig.question_text],
          ["yes_button_text", config.yes_button_text || defaultConfig.yes_button_text],
          ["no_button_text", config.no_button_text || defaultConfig.no_button_text],
          ["celebration_text", config.celebration_text || defaultConfig.celebration_text]
        ])
      });
    }
  </script>
